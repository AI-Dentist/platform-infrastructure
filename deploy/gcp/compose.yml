services:
  edge:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
  keycloak-db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 12
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start --import-realm
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: https://auth.35-237-1-132.sslip.io
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ../../identity/keycloak/dental-erp-realm.json:/opt/keycloak/data/import/dental-erp-realm.json:ro
  n8n-import:
    image: docker.n8n.io/n8nio/n8n:2.47.2
    entrypoint: /bin/sh
    command: -c 'if [ ! -f /home/node/.n8n/.multicanal-imported ]; then n8n import:workflow --input=/workflow/n8n-workflow-multicanal.json && touch /home/node/.n8n/.multicanal-imported; fi'
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
      - ../../automation/n8n/workflows:/workflow:ro
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.47.2
    restart: unless-stopped
    depends_on:
      n8n-import:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
      N8N_HOST: n8n.35-237-1-132.sslip.io
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_SECURE_COOKIE: "true"
      N8N_PROXY_HOPS: "1"
      WEBHOOK_URL: https://n8n.35-237-1-132.sslip.io/
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      CHAT_ID: ${CHAT_ID:-}
      GMAIL_FROM_ADDRESS: ${GMAIL_FROM_ADDRESS:-}
    volumes:
      - n8n_data:/home/node/.n8n
volumes:
  caddy_data:
  caddy_config:
  keycloak_db:
  n8n_data:
