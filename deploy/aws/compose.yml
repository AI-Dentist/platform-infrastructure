name: dental-platform-edge

# AWS edge (TLS). MS3 and the Vue remote come from MS3-AGENDA-STOCK and
# microfrontends-web on the same dental-net.
services:
  edge:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-100-60-248-245.sslip.io}
      SHELL_ORIGIN: ${SHELL_ORIGIN:-https://20-83-242-208.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [dental-net]

volumes:
  caddy-data:
  caddy-config:

networks:
  dental-net:
    external: true
