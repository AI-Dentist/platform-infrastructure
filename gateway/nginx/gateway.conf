# Incluir dentro de http {}, no dentro de server {}.
# Mismo host: ERP_PORT=8081 (el perfil local del ERP usa 8080 por defecto).
upstream erp_backend {
    server 127.0.0.1:8081;
}

# Lista explícita: ajustar a los orígenes del frontend de cada entorno.
map $http_origin $erp_origin {
    default "";
    "http://localhost:4201" $http_origin;
}
map $http_access_control_request_method $erp_method_ok {
    default 0;
    GET 1;
    POST 1;
    DELETE 1;
    OPTIONS 1;
}
map $http_access_control_request_headers $erp_headers_ok {
    default 0;
    "" 1;
    "~*^(Authorization|Content-Type|Accept|Idempotency-Key|Mcp-Session-Id|MCP-Protocol-Version|Last-Event-ID|X-Correlation-ID)([ ]*,[ ]*(Authorization|Content-Type|Accept|Idempotency-Key|Mcp-Session-Id|MCP-Protocol-Version|Last-Event-ID|X-Correlation-ID))*$" 1;
}
map "$request_method|$erp_origin|$erp_headers_ok|$erp_method_ok" $erp_preflight_ok {
    default 0;
    "~^OPTIONS\|.+\|1\|1$" 1;
}
map "$request_method:$erp_preflight_ok" $erp_preflight_denied {
    default 0;
    "OPTIONS:0" 1;
}
map "$request_method:$erp_preflight_ok" $erp_response_origin {
    default $erp_origin;
    "OPTIONS:0" "";
}
map $erp_response_origin $erp_allow_methods {
    "" "";
    default "GET, POST, DELETE, OPTIONS";
}
map $erp_response_origin $erp_allow_headers {
    "" "";
    default "Authorization, Content-Type, Accept, Idempotency-Key, Mcp-Session-Id, MCP-Protocol-Version, Last-Event-ID, X-Correlation-ID";
}
map $erp_response_origin $erp_expose_headers {
    "" "";
    default "Mcp-Session-Id, Content-Disposition, Idempotency-Replayed";
}

server {
    listen 80;
    server_name localhost;

    # MS1 legacy mantiene URI completa; las rutas nativas preservan URLs relativas.
    # Única reescritura: /api/erp/graphql -> /graphql (con query intacta).
    location ~ ^(/api/seguridad/|/api/erp/graphql$|/mcp$|/api/v1/webhooks/pagofacil$|/api/v1/reports/export/) {
        if ($erp_preflight_denied) { return 403; }
        if ($erp_preflight_ok) { return 204; }

        add_header Access-Control-Allow-Origin $erp_response_origin always;
        add_header Access-Control-Allow-Methods $erp_allow_methods always;
        add_header Access-Control-Allow-Headers $erp_allow_headers always;
        add_header Access-Control-Expose-Headers $erp_expose_headers always;
        add_header Vary Origin always;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;

        rewrite ^/api/erp/graphql$ /graphql break;
        proxy_pass http://erp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # No permitir autenticación de desarrollo, incluso en el alias legacy.
        proxy_set_header X-Dev-User "";
        # Authorization, Idempotency-Key, MCP y correlación se reenvían por defecto.
        proxy_buffering off;
        proxy_cache off;
        # Intervalo máximo ENTRE lecturas, no duración máxima de una sesión MCP.
        proxy_read_timeout 300s;
    }

    # MS2 - conservar exactamente la URI recibida.
    location /api/expediente/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MS3 - conservar exactamente la URI recibida.
    location /api/agendamiento/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health público deshabilitado: no publicar Actuator ni inventar health REST.
    location / {
        return 404;
    }
}
