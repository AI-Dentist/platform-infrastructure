name: Deploy Azure edge and gateway

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: deploy-azure-platform-infrastructure
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.AZURE_SSH_KEY }}
          HOST: 20.83.242.208
          USER: azureuser
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -t ed25519 "$HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$USER@$HOST" \
            'cd /home/azureuser/deploy/platform-infrastructure && git pull --ff-only && docker compose up -d --build --remove-orphans && docker compose restart edge api-gateway && docker compose ps'
