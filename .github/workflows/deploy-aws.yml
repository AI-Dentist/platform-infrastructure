name: Deploy AWS edge

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: deploy-aws-platform-infrastructure
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          HOST: 100.60.248.245
          USER: ubuntu
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -t ed25519 "$HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$USER@$HOST" \
            'cd /home/ubuntu/deploy/platform-infrastructure && git pull --ff-only && docker compose up -d --build --remove-orphans && docker compose ps'
