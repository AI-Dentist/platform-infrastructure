apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: dental-erp-prod
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-init
  namespace: dental-erp-prod
data:
  init.js: |
    try { rs.status(); } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo-0.mongo.dental-erp-prod.svc.cluster.local:27017'}]}); }
    while (!db.hello().isWritablePrimary) { sleep(1000); }
    const clinical = db.getSiblingDB('dental_clinico');
    for (const name of ['estudios_clinicos', 'odontogramas', 'consultas_medicas']) {
      if (!clinical.getCollectionNames().includes(name)) clinical.createCollection(name);
    }
    clinical.estudios_clinicos.createIndex({ pacienteId: 1, fechaInferencia: -1 });
    clinical.consultas_medicas.createIndex({ odontologoId: 1, estado: 1 });
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: dental-erp-prod
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels: {app: mongo}
  template:
    metadata:
      labels: {app: mongo}
    spec:
      containers:
        - name: mongo
          image: mongo:7.0
          args: ["--replSet", "rs0", "--bind_ip_all"]
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
        - name: replica-init
          image: mongo:7.0
          command: ["/bin/sh", "-c"]
          args:
            - 'until mongosh --host localhost:27017 --quiet /scripts/init.js; do sleep 5; done; while true; do sleep 3600; done'
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 256Mi}
      volumes:
        - name: scripts
          configMap:
            name: mongo-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
